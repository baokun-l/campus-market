# ====================================================================
# 演示环境配置（profile = demo）
# ====================================================================
# 激活方式：
#   java -jar target/campus-secondhand-backend-1.0.0.jar --spring.profiles.active=demo
#   或在 IDE 运行配置里把 Active profiles 设为 demo
#
# 作用：在「建表 + 基础种子」之外，再自动灌一遍**演示数据** ——
#   16 件商品 / 9 笔订单（7 种状态全覆盖）/ 会话与消息 / 审核与操作日志 /
#   「在线状态」的演示分布 / 演示账号的钱包余额。演示前不用再手敲 mysql 命令。
#
# ★ 这个 profile 是「重置型」的 ★
#   下面的脚本都是「先 DELETE 再 INSERT」的重置语义（幂等 = 每次跑结果一样，
#   不等于「追加」）。所以：
#     · 适合：答辩 / 演示前的准备，一键回到干净的演示态；
#     · 不适合：在演示中途重启 —— 你在系统里新发的商品、新下的单、新充的钱都会被清掉。
#   只要「建库、不重置」就别带这个 profile（默认就是那种行为）。
#   ⚠️ 尤其注意：**支付单与钱包余额也在重置范围内**，别在演示库上做真实交易。
#
# ★ data-locations 是整体覆盖、不是追加 ★
#   Spring Boot 对 List 型配置不跨来源合并：本文件一旦定义 data-locations，
#   就会整体替换掉 application.yml 里的那一条。所以这里必须把 seed-base.sql
#   再列一遍 —— 否则 demo 环境下基础种子反而不会执行，
#   用户表为空 → 谁都登不进来，而且日志里一点错都没有。
# ====================================================================

spring:
  sql:
    init:
      data-locations:
        # ① 基础种子（与 application.yml 保持一致，**不能省** —— 见上面「整体覆盖」）
        - classpath:db/seed-base.sql
        # ② 演示商品：16 件（13 在售 / 1 审核中 / 1 已下架 / 1 已售出），覆盖 8 个分类
        - classpath:db/demo-data.sql
        # ③ 演示订单与会话：9 笔订单（7 种状态全覆盖）+ 订单日志 + 会话 + 消息
        - classpath:db/demo-data-orders.sql
        # ④ 在线状态分布：3 人在线 / 1 人活跃但隐藏 / 2 人真离线
        #    单独跑它的原因：在线判定依赖 last_active_at 这个**绝对时间戳**，
        #    而种子写的是「装库那一刻」的 NOW() 相对值。库里放几天再启动，
        #    这些时间戳全部过期 → 全站一片离线、在线标识一个都不亮，看着像功能坏了。
        #    每次带 demo 启动都刷一遍，演示态永远是对的。
        - classpath:db/demo-online-seed.sql
        # ⑤ 钱包余额：演示账号回到固定 500 元 + 对应充值流水
        #    单独跑它的原因与 ④ 同类：钱包支付是唯一「钱真的动」的渠道，
        #    演示时会**被消耗掉**（点几次余额支付就花完了），之后只会提示余额不足。
        #    每次带 demo 启动都重置一遍，保证「余额支付」永远演示得出来。
        #    ★ 必须排在 demo-data.sql 之后 ★：本脚本只重置余额与流水，
        #      而 demo-data.sql 负责清支付单 —— 顺序反了会留下没有订单的支付记录。
        - classpath:db/demo-wallet-seed.sql

# 演示时可选的辅助开关（按需取消注释）：
#
# logging:
#   level:
#     # 让控制台打印真实 SQL，便于在答辩现场展示「分页被改写成 LIMIT」「动态 SQL 拼成什么样」
#     com.campus.market.mapper: debug
