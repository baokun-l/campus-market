# 反代请求头（被 nginx-campus-market.conf include）
# ★ 与 application-prod.yml 的 server.forward-headers-strategy: framework 配套 ★
# 少了 X-Forwarded-Proto，Spring 会以为自己是 HTTP：将来一旦做绝对地址跳转或
# 记访问日志，IP 会全记成 Nginx 的 127.0.0.1（限流时表现为"把所有人一起限了"）。
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ★ traceId 跨层贯通（P1-6）★
# nginx 自带 $request_id（16 字节十六进制，1.11.0+ 无需额外模块）。
# 透传后，Nginx 的 access_log 与后端日志打的是**同一个 id**：
# 用户报障 → 拿到响应头里的 X-Request-Id → 一次 grep 同时命中"网关那一跳"和"应用这一段"。
# 缺了它也能用（后端自己生成），但那时网关侧与应用侧是两个不相关的 id，跨层排查只能靠时间对齐。
# ★ 后端只接受 [A-Za-z0-9_-]{8,64} ★（防日志注入），$request_id 恰好合规；
#   若有人在这里写死一个常量，所有请求会共用一个 traceId —— 那不叫上下文，叫噪音。
proxy_set_header X-Request-Id      $request_id;

# 优雅停机期间不再往正在下线的实例上派新请求
proxy_next_upstream error timeout;
proxy_connect_timeout 5s;
proxy_read_timeout    60s;
