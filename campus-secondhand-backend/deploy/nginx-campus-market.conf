# ====================================================================
# 校园二手集市 · Nginx 反代配置
# ====================================================================
# 安装：sudo cp nginx-campus-market.conf /etc/nginx/sites-available/campus-market
#       sudo ln -s ../sites-available/campus-market /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# ★★ 三条最容易漏、漏了症状又最怪的规则 ★★
#   1. /uploads/ 必须单独处理。后端 context-path 是 /api，所以图片真实路径是
#      /api/uploads/2026/09/xxx.jpg；而前端 .env.production 里 VITE_API_BASE=/api，
#      页面里引用的又是 /uploads/... —— 少这一条就是**商品图整片裂开**，
#      而接口全部 200，排查方向会被引到"图片上传坏了"上去。
#      这里按 P2-5 直接由 Nginx 读磁盘（更快，且能加缓存头），后端那份映射留着兜底。
#   2. 登录接口要单独限流（P1-7）。种子口令是 admin123 这类弱口令且写在公开仓库里，
#      用户名还能从商品列表直接看到 —— 公网部署后这是最先被扫的点。
#   3. 只把 443 暴露到公网，后端 8080 只监听 127.0.0.1（application-prod.yml 已这么设）。
#      否则攻击者绕过 Nginx 直连 8080，下面的限流与 TLS 全部失效。
# ====================================================================

# ---- 登录接口限流：每 IP 每分钟 5 次 ----
limit_req_zone $binary_remote_addr zone=campus_login:10m rate=5r/m;

server {
    listen 80;
    server_name your-domain.com;
    # 证书签发前先用这一段做 HTTP-01 校验，签完再打开下面的 301
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS：让用户浏览器记住"这个站只走 HTTPS"
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 与 application-prod.yml 的 multipart 上限（2MB）对齐，别这里松那里紧
    client_max_body_size 4m;

    # ---- 前端静态产物 ----
    root /var/www/campus-market;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # Vue 的 history 路由必须回退到 index.html
    }

    # ---- 用户上传的图片：直接读磁盘 + 长缓存 ----
    location /uploads/ {
        alias /data/campus/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 只让图片类型出去，避免落盘的非常规文件被浏览器当别的类型解析
        location ~* \.(php|jsp|sh|html?)$ { return 404; }
    }

    # ---- 登录：限流 ----
    location = /api/user/login {
        limit_req zone=campus_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    # ---- 健康检查（P1-5）：单独列出，便于按需要加来源限制 ----
    #
    # ★ 为什么必须单独有一条 ★
    #   /api/ 那条 location 里若将来加了 limit_req，探针每 5~10 秒一次的访问会被限流
    #   拒绝 —— 而本项目连限流拒绝也是 HTTP 200 + body 码，
    #   探针"看到 200 判定健康"，于是一次限流把监控变成常绿。
    #   单独列出来也方便你按来源收紧（例如只让内网监控访问）：
    #
    #     location = /api/health {
    #         allow 10.0.0.0/8;
    #         allow 172.16.0.0/12;
    #         allow 192.168.0.0/16;
    #         deny all;
    #         proxy_pass http://127.0.0.1:8080;
    #         include /etc/nginx/snippets/campus-proxy-headers.conf;
    #     }
    #
    #   ⚠️ 加了 allow/deny 却忘了给云监控加白名单，会得到"探测全部 403"，
    #   而 403 的原因是 Nginx 层拒绝、后端一行日志都没有（请求没进来）——
    #   排障时最容易往应用里找，其实是网关层没放行。
    #
    # ★ 不用只依赖这条路径做存活判断 ★：本端点按项目约定恒返回 HTTP 200
    #   （数据库挂了也是 200，状态在 body.data.status 里）。
    #   LB 用它判"进程还活着"，监控用它判"依赖健不健康"，
    #   后者需要看响应体：curl -fsS .../api/health | jq -e '.data.status == "UP"'
    location = /api/health {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }
}
